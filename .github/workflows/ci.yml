name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

# One offline workflow: no browser, no network fixtures, no real-browser
# extension jobs (those fail 100% on GitHub-hosted runners — browser testing is
# a documented manual step in source/docs/WORKLIST.md).
#
# Every step below is just an `npm run` script, so the exact same commands run
# locally and in CI and there is no shell logic to keep in sync with
# package.json (the previous workflow inlined a hand-maintained file list that
# had already drifted from the one in package.json).
jobs:
  ci:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension (syntax, JSON, branding)
        run: npm run check

      - name: Offline fixture suites (naming, ZIP, PDF, queue restore)
        run: npm run test:fixtures

      - name: Smoke test (mocked chrome + fetch, real service worker)
        run: npm run test:smoke

      - name: e2e output-path pipelines (real service worker + offscreen document)
        run: npm run test:e2e
